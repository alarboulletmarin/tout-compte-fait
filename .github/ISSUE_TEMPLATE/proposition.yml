name: 💡 Proposition
description: Proposer une évolution, ou discuter d'un choix de conception
labels: ['proposition']
body:
  - type: markdown
    attributes:
      value: |
        Avant d'écrire quoi que ce soit, une lecture qui fait gagner du temps :

        - [CONTRIBUTING.md](https://github.com/alarboulletmarin/tout-compte-fait/blob/main/CONTRIBUTING.md)
          rappelle que c'est un projet personnel dont le code est ouvert : une
          proposition peut être refusée sur le périmètre, même excellente.

        Ça ne veut pas dire qu'il ne faut pas proposer — ça veut dire qu'il vaut
        mieux proposer **avant** d'écrire du code.

  - type: textarea
    id: probleme
    attributes:
      label: Le problème
      description: |
        Ce que tu n'arrives pas à faire, ou ce qui te coûte du temps. Le problème
        avant la solution : « je n'arrive pas à savoir combien il me reste avant
        le prochain salaire » se discute, « ajoutez un bouton » se refuse.
      placeholder: |
        Chaque mois je recopie à la main ce que j'ai avancé pour l'autre, parce que…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ce que tu imagines
      description: Si tu as une idée de la forme que ça prendrait. Facultatif.
    validations:
      required: false

  - type: textarea
    id: contournement
    attributes:
      label: Comment tu fais aujourd'hui
      description: |
        Le contournement actuel, dans l'app ou en dehors. C'est souvent lui qui
        dit si le manque est réel et à quel point il coûte.
    validations:
      required: false

  - type: checkboxes
    id: verifications
    attributes:
      label: Avant d'envoyer
      options:
        - label: J'ai lu la section 2 du cahier des charges, et ma proposition n'est pas dans les exclusions
          required: true
        - label: J'ai vérifié qu'aucune issue ouverte ne porte déjà cette idée
          required: true
